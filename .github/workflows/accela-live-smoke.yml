name: Accela Live Verification (one-off)

# Final tenant verification after honoring each ACA form's actual postback action.
on:
  push:
    paths:
      - .github/workflows/accela-live-smoke.yml

concurrency:
  group: accela-live-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "services/ingest[dev]"
      - name: Verify Solano and Napa Accela tenants
        shell: bash
        run: |
          set +e
          ns-trackstar-ingest collect config/smoke/solano-county.accela.json > /tmp/solano.out 2>&1
          solano_status=$?
          echo "===== SOLANO COUNTY ====="
          cat /tmp/solano.out

          ns-trackstar-ingest collect config/smoke/napa-county.accela.json > /tmp/napa.out 2>&1
          napa_status=$?
          echo "===== NAPA COUNTY ====="
          cat /tmp/napa.out

          if [ "$solano_status" -ne 0 ] || [ "$napa_status" -ne 0 ]; then
            exit 1
          fi
