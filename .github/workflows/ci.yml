name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Install release QA browsers
        run: pnpm --filter @ns-trackstar/web exec playwright install --with-deps chromium firefox webkit
      - name: Run cross-browser release QA
        run: pnpm --filter @ns-trackstar/web qa:e2e

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "services/ingest[dev]" -e "services/api[dev]"
      - run: ruff check services/ingest/src services/ingest/tests services/api/src services/api/tests infra/collector_scheduler.py
      - run: pytest -q services/ingest/tests services/api/tests

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: nstrackstar
          POSTGRES_USER: nstrackstar
          POSTGRES_PASSWORD: nstrackstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nstrackstar -d nstrackstar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: nstrackstar
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply database migrations in order
        run: |
          for migration in db/migrations/*.sql; do
            psql -h localhost -U nstrackstar -d nstrackstar -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: psql -h localhost -U nstrackstar -d nstrackstar -c "SELECT PostGIS_Version();"
      - name: Verify backup and recovery round trip
        run: |
          pg_dump -h localhost -U nstrackstar -d nstrackstar --format=custom --no-owner --no-acl --file=/tmp/nstrackstar.dump
          test -s /tmp/nstrackstar.dump
          dropdb -h localhost -U nstrackstar --if-exists nstrackstar_restore
          createdb -h localhost -U nstrackstar nstrackstar_restore
          pg_restore -h localhost -U nstrackstar -d nstrackstar_restore --no-owner --no-acl --exit-on-error /tmp/nstrackstar.dump
          original_tables="$(psql -h localhost -U nstrackstar -d nstrackstar -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")"
          restored_tables="$(psql -h localhost -U nstrackstar -d nstrackstar_restore -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")"
          test "$original_tables" -gt 0
          test "$original_tables" = "$restored_tables"
          psql -h localhost -U nstrackstar -d nstrackstar_restore -c "SELECT PostGIS_Version();"

  deployment:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      API_DOMAIN: api.example.com
      CORS_ORIGINS: https://trackstar.example
      CADDY_ACME_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery and deployment scripts
        run: bash -n scripts/backup-production-db.sh scripts/restore-production-db.sh scripts/deploy-oracle.sh
      - name: Validate production Compose file
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Build production backend image
        run: docker build -f infra/backend/Dockerfile -t ns-trackstar-backend:ci .
      - name: Build production PostGIS image
        run: docker build -f infra/postgis/Dockerfile -t ns-trackstar-postgis:ci .
      - name: Validate HTTPS proxy configuration
        run: >-
          docker run --rm
          -e API_DOMAIN
          -e CADDY_ACME_EMAIL
          -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile
