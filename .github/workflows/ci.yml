name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "services/ingest[dev]" -e "services/api[dev]"
      - run: ruff check services/ingest/src services/ingest/tests services/api/src services/api/tests
      - run: pytest -q services/ingest/tests services/api/tests

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: nstrackstar
          POSTGRES_USER: nstrackstar
          POSTGRES_PASSWORD: nstrackstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nstrackstar -d nstrackstar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: nstrackstar
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -h localhost -U nstrackstar -d nstrackstar -v ON_ERROR_STOP=1 -f db/migrations/0001_core.sql
      - run: psql -h localhost -U nstrackstar -d nstrackstar -c "SELECT PostGIS_Version();"
