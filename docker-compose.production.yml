name: ns-trackstar

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    build:
      context: .
      dockerfile: infra/postgis/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nstrackstar}
      POSTGRES_USER: ${POSTGRES_USER:-nstrackstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nstrackstar} -d ${POSTGRES_DB:-nstrackstar}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: infra/postgis/Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nstrackstar}
      POSTGRES_USER: ${POSTGRES_USER:-nstrackstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./infra/migrate.sh:/usr/local/bin/ns-trackstar-migrate:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ns-trackstar-migrate"]
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: infra/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nstrackstar}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-nstrackstar}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  collector:
    build:
      context: .
      dockerfile: infra/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "/app/infra/collector_scheduler.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nstrackstar}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-nstrackstar}
      SCHEDULER_TICK_SECONDS: "60"
      # Token-gated sources read these by name. Without them the collector process
      # cannot see a key that exists on the host, which is exactly what happened:
      # the 511 token was supplied and the collector never received it.
      # Both default to empty so an unconfigured deployment still starts.
      BAYAREA_511_API_KEY: ${BAYAREA_511_API_KEY:-}
      COURTLISTENER_API_TOKEN: ${COURTLISTENER_API_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
